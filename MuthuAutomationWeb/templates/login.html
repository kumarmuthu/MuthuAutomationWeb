<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - MuthuAutomationWeb</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        .pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex flex-col">
    <header class="glass sticky top-0 z-10 border-b border-slate-200 px-4 py-3 flex justify-between items-center">
        <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">
            Secure Login
        </h1>
        <div class="flex items-center space-x-3">
            <span id="socket-status" class="w-2 h-2 rounded-full bg-red-500"></span>
            <a href="/" class="text-slate-400 text-xl">✕</a>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center p-6 max-w-md mx-auto w-full">
        <div class="bg-white w-full p-8 rounded-3xl border border-slate-200 shadow-xl space-y-6">
            <div class="text-center">
                <h2 class="text-2xl font-bold">Access Portal</h2>
                <p class="text-slate-500 text-sm">Enter credentials to continue</p>
            </div>

            <form class="space-y-4" onsubmit="alert('Login simulation successful'); return false;">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1 ml-1">Username</label>
                    <input type="text" class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all" placeholder="muthu_dev" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1 ml-1">Password</label>
                    <input type="password" class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all" placeholder="••••••••" required>
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl shadow-lg shadow-indigo-200 hover:bg-indigo-700 active:scale-[0.98] transition-all">
                    Sign In
                </button>
            </form>

            <div class="text-center">
                <a href="#" class="text-sm text-indigo-600 font-medium">Forgot Password?</a>
            </div>
        </div>
    </main>

    <nav class="glass border-t border-slate-200 px-6 py-3 flex justify-between items-center sticky bottom-0">
        <a href="/" class="flex flex-col items-center text-slate-400 hover:text-indigo-600 transition-colors">
            <span class="text-xl">🏠</span>
            <span class="text-[10px] font-bold uppercase">Home</span>
        </a>
        <a href="/login" class="flex flex-col items-center text-indigo-600">
            <span class="text-xl">🔑</span>
            <span class="text-[10px] font-bold uppercase">Login</span>
        </a>
        <a href="/about" class="flex flex-col items-center text-slate-400 hover:text-indigo-600 transition-colors">
            <span class="text-xl">ℹ️</span>
            <span class="text-[10px] font-bold uppercase">About</span>
        </a>
        <a href="/credit" class="flex flex-col items-center text-slate-400 hover:text-indigo-600 transition-colors">
            <span class="text-xl">💎</span>
            <span class="text-[10px] font-bold uppercase">Credit</span>
        </a>
    </nav>

    <script>
        const socket = io();
        const statusDot = document.getElementById('socket-status');
        socket.on('connect', () => {
            statusDot.classList.remove('bg-red-500');
            statusDot.classList.add('bg-green-500', 'pulse');
        });
        socket.on('disconnect', () => {
            statusDot.classList.remove('bg-green-500', 'pulse');
            statusDot.classList.add('bg-red-500');
        });
    </script>
</body>
</html>
