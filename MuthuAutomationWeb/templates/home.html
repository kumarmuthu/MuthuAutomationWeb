<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MuthuAutomationWeb</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        .pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex flex-col">
    <!-- Header -->
    <header class="glass sticky top-0 z-10 border-b border-slate-200 px-4 py-3 flex justify-between items-center">
        <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">
            MuthuAutomationWeb
        </h1>
        <div class="flex items-center space-x-2">
            <span id="socket-status" class="w-2 h-2 rounded-full bg-red-500"></span>
            <div class="h-8 w-8 rounded-full bg-indigo-100 flex items-center justify-center">
                <span class="text-xs font-bold text-indigo-600">MS</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow p-4 space-y-4 max-w-md mx-auto w-full">
        <div class="bg-indigo-600 rounded-2xl p-6 text-white shadow-lg shadow-indigo-200">
            <h2 class="text-2xl font-bold mb-1">Live Dashboard</h2>
            <p class="text-indigo-100 text-sm">Real-time automation metrics.</p>
            <div class="mt-4 text-xs font-mono opacity-70">Last Sync: <span id="sync-time">--:--:--</span></div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <div class="text-indigo-600 mb-2 text-xl">⚡</div>
                <div class="text-xs text-slate-500 uppercase font-semibold tracking-tighter">Active Tasks</div>
                <div id="tasks-count" class="text-2xl font-bold">0</div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <div class="text-green-500 mb-2 text-xl">✔</div>
                <div class="text-xs text-slate-500 uppercase font-semibold tracking-tighter">System Status</div>
                <div id="status-text" class="text-xl font-bold text-green-600">Off</div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <div class="text-orange-500 mb-2 text-xl">📊</div>
                <div class="text-xs text-slate-500 uppercase font-semibold tracking-tighter">CPU Load</div>
                <div id="cpu-load" class="text-2xl font-bold">0%</div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <div class="text-blue-500 mb-2 text-xl">🧠</div>
                <div class="text-xs text-slate-500 uppercase font-semibold tracking-tighter">Memory</div>
                <div id="mem-usage" class="text-2xl font-bold">0%</div>
            </div>
        </div>

        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
            <h3 class="font-bold border-b pb-2 text-slate-700 mb-3">System Uptime</h3>
            <div id="uptime-text" class="text-3xl font-black text-indigo-600 tracking-tight">0h 0m 0s</div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="glass border-t border-slate-200 px-6 py-3 flex justify-between items-center sticky bottom-0">
        <a href="/" class="flex flex-col items-center text-indigo-600">
            <span class="text-xl">🏠</span>
            <span class="text-[10px] font-bold uppercase">Home</span>
        </a>
        <a href="/login" class="flex flex-col items-center text-slate-400 hover:text-indigo-600 transition-colors">
            <span class="text-xl">🔑</span>
            <span class="text-[10px] font-bold uppercase">Login</span>
        </a>
        <a href="/about" class="flex flex-col items-center text-slate-400 hover:text-indigo-600 transition-colors">
            <span class="text-xl">ℹ️</span>
            <span class="text-[10px] font-bold uppercase">About</span>
        </a>
        <a href="/credit" class="flex flex-col items-center text-slate-400 hover:text-indigo-600 transition-colors">
            <span class="text-xl">💎</span>
            <span class="text-[10px] font-bold uppercase">Credit</span>
        </a>
    </nav>

    <script>
        const socket = io();
        const statusDot = document.getElementById('socket-status');

        socket.on('connect', () => {
            console.log('Connected to server');
            statusDot.classList.remove('bg-red-500');
            statusDot.classList.add('bg-green-500', 'pulse');
        });

        socket.on('disconnect', () => {
            console.log('Disconnected from server');
            statusDot.classList.remove('bg-green-500', 'pulse');
            statusDot.classList.add('bg-red-500');
        });

        socket.on('update', (data) => {
            console.log('Update received:', data);
            document.getElementById('sync-time').textContent = data.time || '--:--:--';
            document.getElementById('tasks-count').textContent = data.tasks_active || 0;

            const statusEl = document.getElementById('status-text');
            statusEl.textContent = data.status || 'Offline';

            // Dynamic status coloring
            statusEl.className = 'text-xl font-bold transition-colors duration-500';
            if (data.status === 'Busy') statusEl.classList.add('text-orange-500');
            else if (data.status === 'Syncing') statusEl.classList.add('text-blue-500');
            else if (data.status === 'Idle') statusEl.classList.add('text-slate-400');
            else statusEl.classList.add('text-green-600');

            document.getElementById('cpu-load').textContent = (data.cpu_usage || 0) + '%';
            document.getElementById('mem-usage').textContent = (data.memory_usage || 0) + '%';
            document.getElementById('uptime-text').textContent = data.uptime || '0s';
        });
    </script>
</body>
</html>
