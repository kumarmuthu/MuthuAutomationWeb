<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Credits - MuthuAutomationWeb</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        .pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex flex-col">
    <header class="glass sticky top-0 z-10 border-b border-slate-200 px-4 py-3 flex justify-between items-center">
        <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">
            Credits
        </h1>
        <div class="flex items-center space-x-3">
            <span id="socket-status" class="w-2 h-2 rounded-full bg-red-500"></span>
            <a href="/" class="text-slate-400 text-xl">✕</a>
        </div>
    </header>

    <main class="flex-grow p-6 flex flex-col items-center justify-center space-y-8 max-w-md mx-auto w-full">
        <div class="relative">
            <div class="w-32 h-32 bg-indigo-600 rounded-full flex items-center justify-center text-white text-5xl shadow-2xl shadow-indigo-300">
                👨‍💻
            </div>
            <div class="absolute -bottom-2 -right-2 bg-green-500 border-4 border-white w-8 h-8 rounded-full"></div>
        </div>

        <div class="text-center space-y-2">
            <h2 class="text-3xl font-black text-slate-800 tracking-tight">Muthukumar S</h2>
            <p class="text-indigo-600 font-bold uppercase tracking-widest text-xs">Full Stack Developer/Automation Engineer</p>
        </div>

        <div class="w-full space-y-4">
            <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex items-center space-x-4">
                <div class="text-2xl">🌍</div>
                <div>
                    <div class="text-xs text-slate-400 font-bold uppercase">Location</div>
                    <div class="font-medium">Tamil Nadu, India</div>
                </div>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex items-center space-x-4">
                <div class="text-2xl">🛠️</div>
                <div>
                    <div class="text-xs text-slate-400 font-bold uppercase">Tech Stack</div>
                    <div class="font-medium">Python, Flask, Kotlin, Android</div>
                </div>
            </div>
        </div>

        <p class="text-sm text-slate-400 text-center italic">
            "Automating the future, one script at a time."
        </p>
    </main>

    <nav class="glass border-t border-slate-200 px-6 py-3 flex justify-between items-center sticky bottom-0">
        <a href="/" class="flex flex-col items-center text-slate-400 hover:text-indigo-600 transition-colors">
            <span class="text-xl">🏠</span>
            <span class="text-[10px] font-bold uppercase">Home</span>
        </a>
        <a href="/login" class="flex flex-col items-center text-slate-400 hover:text-indigo-600 transition-colors">
            <span class="text-xl">🔑</span>
            <span class="text-[10px] font-bold uppercase">Login</span>
        </a>
        <a href="/about" class="flex flex-col items-center text-slate-400 hover:text-indigo-600 transition-colors">
            <span class="text-xl">ℹ️</span>
            <span class="text-[10px] font-bold uppercase">About</span>
        </a>
        <a href="/credit" class="flex flex-col items-center text-indigo-600">
            <span class="text-xl">💎</span>
            <span class="text-[10px] font-bold uppercase">Credit</span>
        </a>
    </nav>

    <script>
        const socket = io();
        const statusDot = document.getElementById('socket-status');
        socket.on('connect', () => {
            statusDot.classList.remove('bg-red-500');
            statusDot.classList.add('bg-green-500', 'pulse');
        });
        socket.on('disconnect', () => {
            statusDot.classList.remove('bg-green-500', 'pulse');
            statusDot.classList.add('bg-red-500');
        });
    </script>
</body>
</html>
