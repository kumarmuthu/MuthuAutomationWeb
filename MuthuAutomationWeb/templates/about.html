<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>About - MuthuAutomationWeb</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        .pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex flex-col">
    <header class="glass sticky top-0 z-10 border-b border-slate-200 px-4 py-3 flex justify-between items-center">
        <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">
            About
        </h1>
        <div class="flex items-center space-x-3">
            <span id="socket-status" class="w-2 h-2 rounded-full bg-red-500"></span>
            <a href="/" class="text-slate-400 text-xl">✕</a>
        </div>
    </header>

    <main class="flex-grow p-4 space-y-6 max-w-md mx-auto w-full">
        <div class="text-center py-6">
            <div class="w-20 h-20 bg-indigo-100 rounded-2xl mx-auto flex items-center justify-center text-3xl mb-4">🤖</div>
            <h2 class="text-2xl font-bold">MuthuAutomationWeb</h2>
            <p class="text-slate-500">Version 1.0.0 (Stable)</p>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200 divide-y divide-slate-100 overflow-hidden shadow-sm">
            <div class="p-4 flex items-center justify-between">
                <span class="text-slate-600">Platform</span>
                <span class="font-medium">Android / Flask</span>
            </div>
            <div class="p-4 flex items-center justify-between">
                <span class="text-slate-600">Framework</span>
                <span class="font-medium">Chaquopy 15.0</span>
            </div>
            <div class="p-4 flex items-center justify-between">
                <span class="text-slate-600">Uptime</span>
                <span class="font-medium text-green-600">99.9%</span>
            </div>
        </div>

        <p class="text-sm text-slate-500 text-center leading-relaxed px-4">
            MuthuAutomation provides cutting-edge solutions for automated workflows on mobile devices using Python and Flask.
        </p>
    </main>

    <nav class="glass border-t border-slate-200 px-6 py-3 flex justify-between items-center sticky bottom-0">
        <a href="/" class="flex flex-col items-center text-slate-400 hover:text-indigo-600 transition-colors">
            <span class="text-xl">🏠</span>
            <span class="text-[10px] font-bold uppercase">Home</span>
        </a>
        <a href="/login" class="flex flex-col items-center text-slate-400 hover:text-indigo-600 transition-colors">
            <span class="text-xl">🔑</span>
            <span class="text-[10px] font-bold uppercase">Login</span>
        </a>
        <a href="/about" class="flex flex-col items-center text-indigo-600">
            <span class="text-xl">ℹ️</span>
            <span class="text-[10px] font-bold uppercase">About</span>
        </a>
        <a href="/credit" class="flex flex-col items-center text-slate-400 hover:text-indigo-600 transition-colors">
            <span class="text-xl">💎</span>
            <span class="text-[10px] font-bold uppercase">Credit</span>
        </a>
    </nav>

    <script>
        const socket = io();
        const statusDot = document.getElementById('socket-status');
        socket.on('connect', () => {
            statusDot.classList.remove('bg-red-500');
            statusDot.classList.add('bg-green-500', 'pulse');
        });
        socket.on('disconnect', () => {
            statusDot.classList.remove('bg-green-500', 'pulse');
            statusDot.classList.add('bg-red-500');
        });
    </script>
</body>
</html>
